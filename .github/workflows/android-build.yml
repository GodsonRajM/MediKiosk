name: MediKiosk Android APK Build & CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Web Application
        working-directory: ./frontend
        env:
          NEXT_EXPORT: 'true'
          NEXT_PUBLIC_SUPABASE_URL: 'https://sybadtgsjvtwmvrdulfk.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_ZrHHVFfnGWZIJ1yXzrUgqw_CUKN7G5g'
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || '' }}
          NEXT_PUBLIC_PRODUCTION_URL: 'https://medikiosk-50ce2.web.app'
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: ./frontend
        run: |
          chmod +x android/gradlew
          npx cap sync android 2>&1 | tee /tmp/cap_sync.log || (echo "::error title=CapacitorSyncError::$(cat /tmp/cap_sync.log | tr '\r\n' ' ')" && exit 1)

      - name: Build Android Debug APK with Gradle
        working-directory: ./frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/gradle.log || (echo "::error title=GradleBuildError::$(cat /tmp/gradle.log | grep -E 'FAILURE|What went wrong|Execution failed|compile' -A 3 | tr '\r\n' ' ')" && exit 1)

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: medikiosk-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Distribute APK via Firebase App Distribution
        if: github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != ''
        continue-on-error: true
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
          file: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "MediKiosk Build: Gemini Live AI Voice Assistant, 24/7 Secure Emergency QR Portal, and Session Token Fix."

      - name: Deploy Emergency Portal to Firebase Hosting
        if: github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != ''
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ env.FIREBASE_PROJECT_ID || 'medikiosk-50ce2' }}
          channelId: live

      - name: Deploy Web Portal to GitHub Pages (Fallback)
        uses: peaceiris/actions-gh-pages@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/out

